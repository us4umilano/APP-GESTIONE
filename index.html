<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reindirizzamento...</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f9f9f9; }
    .box { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Sincronizzazione in corso...</h3>
    <p>Verifica dell'account Google...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const loopParam = urlParams.get('loop') || '';
    
    // URL della tua Web App principale di Google
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM8bk0RcdHSqEikPSSMuFUMvQMPr7prS5ram9uwElkbS1PPMDT9Dw1zy_3rHMIk4RG/exec";
    
    // Salta direttamente alla Web App senza blocchi di sicurezza frame
    window.location.replace(`${GOOGLE_SCRIPT_URL}?loop=${loopParam}`);
  </script>
</body>
</html>
